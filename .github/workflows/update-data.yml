# .github/workflows/update-data.yml
name: Update LoL data

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC. Adjust freely — more often is fine,
    # the Leaguepedia query is small and the runner minutes are free on public repos.
    - cron: "0 */6 * * *"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
    inputs:
      days:
        description: "How many days of history to keep in the feed"
        required: false
        default: "120"
        type: choice
        options: ["30", "60", "90", "120", "180"]

permissions:
  contents: write           # required so the job can commit the refreshed feed

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet gdown

      - name: Fetch match data
        env:
          # Manual runs use the dropdown; scheduled runs use the full window.
          DAYS: ${{ github.event.inputs.days || '120' }}
          LP_USERNAME: ${{ secrets.LP_USERNAME }}
          LP_PASSWORD: ${{ secrets.LP_PASSWORD }}
        run: python fetch_combined.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "mc-ai-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # jsDelivr caches branch URLs for ~12h. Purging makes the new file live
      # immediately, so the app sees fresh data on the next pull.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The app sandbox only permits cdn.jsdelivr.net/npm/ — measured, /gh/ is blocked.
      # Publishing makes the feed reachable at that path. Version is derived from the run
      # number so every refresh is a new immutable release.
      # Publish must never take the job down, and its error must be readable from the
      # repo rather than only in CI logs — that is how the last three failures were solved.
      - name: Publish feed to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p data
          {
            echo "=== npm publish attempt $(date -u +'%Y-%m-%d %H:%M UTC') ==="
            if [ -z "${NODE_AUTH_TOKEN}" ]; then
              echo "RESULT: NPM_TOKEN secret is EMPTY or not set."
              echo "Fix: repo Settings > Secrets and variables > Actions > New repository secret,"
              echo "     named exactly NPM_TOKEN, value = an npm Automation token."
            else
              echo "token present: yes (length ${#NODE_AUTH_TOKEN})"
              echo "--- npm whoami ---"
              npm whoami 2>&1 || echo "(whoami failed - token invalid, expired, or wrong type)"
              echo "--- npm version ---"
              npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version 2>&1
              echo "--- npm publish ---"
              npm publish --access public 2>&1
              echo "exit code: $?"
            fi
          } > data/npm-publish.log 2>&1 || true
          echo "----- publish log -----"
          cat data/npm-publish.log

      - name: Commit publish log
        run: |
          git config user.name  "mc-ai-bot"
          git config user.email "actions@github.com"
          git add data/npm-publish.log || true
          if git diff --staged --quiet; then
            echo "no log change"
          else
            git commit -m "ci: npm publish log $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash || true
            git push || true
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          PKG=$(node -p "require('./package.json').name")
          curl -sS "https://purge.jsdelivr.net/npm/$PKG@latest/data/latest.json" || true
          echo
          echo "Feed URL: https://cdn.jsdelivr.net/npm/$PKG@latest/data/latest.json"
