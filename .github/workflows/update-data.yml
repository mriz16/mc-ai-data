# .github/workflows/update-data.yml
name: Update LoL data

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC. Adjust freely — more often is fine,
    # the Leaguepedia query is small and the runner minutes are free on public repos.
    - cron: "0 */6 * * *"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
    inputs:
      days:
        description: "How many days of history to keep in the feed"
        required: false
        default: "30"
        type: choice
        options: ["7", "14", "30", "60", "90"]

permissions:
  contents: write           # required so the job can commit the refreshed feed

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch match data
        env:
          # Manual runs use the dropdown; scheduled runs use the full window.
          DAYS: ${{ github.event.inputs.days || '30' }}
          LP_USERNAME: ${{ secrets.LP_USERNAME }}
          LP_PASSWORD: ${{ secrets.LP_PASSWORD }}
        run: python fetch_riot.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "mc-ai-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # jsDelivr caches branch URLs for ~12h. Purging makes the new file live
      # immediately, so the app sees fresh data on the next pull.
      - name: Set up Node
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # The app sandbox only permits cdn.jsdelivr.net/npm/ — measured, /gh/ is blocked.
      # Publishing makes the feed reachable at that path. Version is derived from the run
      # number so every refresh is a new immutable release.
      - name: Publish feed to npm
        if: steps.commit.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm publish --access public

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          PKG=$(node -p "require('./package.json').name")
          curl -sS "https://purge.jsdelivr.net/npm/$PKG@latest/data/latest.json" || true
          echo
          echo "Feed URL: https://cdn.jsdelivr.net/npm/$PKG@latest/data/latest.json"
